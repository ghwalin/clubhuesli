<section class="card">
    <header class="card__header">
        <h1>Personen</h1>
        <div class="card__actions">
            <a class="button button--primary" href="#/persons/new/natural">Natürliche Person</a>
            <a class="button" href="#/persons/new/legal">Juristische Person</a>
        </div>
    </header>

    <p class="form-error" id="person-list-error" hidden></p>

    <table class="table" id="person-table">
        <thead>
            <tr>
                <th><button type="button" class="table__sort" data-sort="displayName">Name</button></th>
                <th><button type="button" class="table__sort" data-sort="personType">Personenart</button></th>
                <th><button type="button" class="table__sort" data-sort="email">E-Mail</button></th>
                <th><button type="button" class="table__sort" data-sort="phone">Telefon</button></th>
                <th class="table__actions">Aktionen</th>
            </tr>
            <tr class="table__filters">
                <th data-label="Name"><input type="search" data-filter="displayName" placeholder="Filtern" aria-label="Name filtern"></th>
                <th data-label="Personenart">
                    <select data-filter="personType" aria-label="Personenart filtern">
                        <option value="">Alle</option>
                        <option value="NATURAL">Natürlich</option>
                        <option value="LEGAL">Juristisch</option>
                    </select>
                </th>
                <th data-label="E-Mail"><input type="search" data-filter="email" placeholder="Filtern" aria-label="E-Mail filtern"></th>
                <th data-label="Telefon"><input type="search" data-filter="phone" placeholder="Filtern" aria-label="Telefon filtern"></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="person-rows"></tbody>
    </table>

    <p class="hint" id="person-count"></p>
</section>
