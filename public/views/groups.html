<section class="card">
    <header class="card__header">
        <h1>Gruppen</h1>
    </header>

    <div class="toolbar">
        <div class="field field--inline">
            <label for="group-view">Ansicht</label>
            <select id="group-view">
                <option value="list">Liste</option>
                <option value="tree">Baum</option>
            </select>
        </div>
    </div>

    <p class="form-error" id="group-list-error" hidden></p>

    <table class="table" id="group-table">
        <thead>
            <tr>
                <th><button type="button" class="table__sort" data-sort="name">Bezeichnung</button></th>
                <th><button type="button" class="table__sort" data-sort="groupTypeLabel">Gruppenart</button></th>
                <th><button type="button" class="table__sort" data-sort="status">Status</button></th>
                <th><button type="button" class="table__sort" data-sort="parentNames">Obergruppen</button></th>
                <th><button type="button" class="table__sort" data-sort="childNames">Untergruppen</button></th>
                <th class="table__actions">Aktionen</th>
            </tr>
            <tr class="table__filters">
                <th data-label="Bezeichnung"><input type="search" data-filter="name" placeholder="Filtern" aria-label="Bezeichnung filtern"></th>
                <th data-label="Gruppenart"><select data-filter="groupType" id="filter-group-type" aria-label="Gruppenart filtern"></select></th>
                <th data-label="Status"><select data-filter="status" id="filter-group-status" aria-label="Status filtern"></select></th>
                <th data-label="Obergruppen"><input type="search" data-filter="parentNames" placeholder="Filtern" aria-label="Obergruppen filtern"></th>
                <th data-label="Untergruppen"><input type="search" data-filter="childNames" placeholder="Filtern" aria-label="Untergruppen filtern"></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="group-rows"></tbody>
    </table>
    <div id="group-tree" hidden></div>

    <p class="hint" id="group-count"></p>
</section>

<section class="card">
    <h2>Neue Gruppe</h2>
    <form id="group-create-form" novalidate>
        <div class="grid">
            <div class="field">
                <label for="new-group-name">Bezeichnung <span class="required">*</span></label>
                <input type="text" id="new-group-name" name="name" maxlength="100">
                <p class="field-error" data-error-for="name"></p>
            </div>
            <div class="field">
                <label for="new-group-type">Gruppenart <span class="required">*</span></label>
                <select id="new-group-type" name="groupType"></select>
                <p class="field-error" data-error-for="groupType"></p>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="button button--primary">Gruppe anlegen</button>
        </div>
    </form>
</section>
