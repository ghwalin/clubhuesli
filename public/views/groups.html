<section class="card">
    <header class="card__header">
        <h1>Gruppen</h1>
    </header>

    <form id="group-filter" class="toolbar" novalidate>
        <div class="field field--inline">
            <label for="filter-group-type">Gruppenart</label>
            <select id="filter-group-type" name="groupType"></select>
        </div>
        <div class="field field--inline">
            <label for="filter-group-status">Status</label>
            <select id="filter-group-status" name="status"></select>
        </div>
        <div class="field field--inline">
            <label for="group-view">Ansicht</label>
            <select id="group-view">
                <option value="list">Liste</option>
                <option value="tree">Baum</option>
            </select>
        </div>
        <button type="submit" class="button">Filtern</button>
    </form>

    <p class="form-error" id="group-list-error" hidden></p>
    <div id="group-list"></div>
</section>

<section class="card">
    <h2>Neue Gruppe</h2>
    <form id="group-create-form" novalidate>
        <div class="grid">
            <div class="field">
                <label for="new-group-name">Bezeichnung <span class="required">*</span></label>
                <input type="text" id="new-group-name" name="name" maxlength="100">
                <p class="field-error" data-error-for="name"></p>
            </div>
            <div class="field">
                <label for="new-group-type">Gruppenart <span class="required">*</span></label>
                <select id="new-group-type" name="groupType"></select>
                <p class="field-error" data-error-for="groupType"></p>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="button button--primary">Gruppe anlegen</button>
        </div>
    </form>
</section>
